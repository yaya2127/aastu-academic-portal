name: AASTU Academic Portal Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Go 1.22
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Verify Go Code Build
      run: |
        go build -v ./...

    - name: Run Go Unit Tests
      run: |
        go test -v ./...
# Build concurrency config
