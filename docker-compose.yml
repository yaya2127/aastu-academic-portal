version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=aastu_user
      - DB_PASSWORD=aastu_password
      - DB_NAME=aastu_portal_db
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aastu_user
      POSTGRES_PASSWORD: aastu_password
      POSTGRES_DB: aastu_portal_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
